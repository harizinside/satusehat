name: Publish

on:
  release:
    types: [published]
  workflow_dispatch: # retry a partially failed publish

permissions:
  contents: read
  id-token: write # OIDC: npm trusted publishing + provenance, JSR auth

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      # Skip when this version is already on npm so a JSR-only retry can pass.
      - run: |
          SPEC="$(node -p 'const p=require("./package.json"); p.name+"@"+p.version')"
          if npm view "$SPEC" version --prefer-online >/dev/null 2>&1; then
            echo "$SPEC already on npm, skipping"
          else
            npm publish --access public
          fi
      - run: npx --yes jsr publish
