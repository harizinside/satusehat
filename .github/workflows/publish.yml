name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC: npm trusted publishing + provenance, JSR auth

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
      - run: npx --yes jsr publish
